<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070707"><meta name="description" content="KRISH CAPTURES — fine-art landscape, wildlife, architecture, portrait and travel photography.">
<title>KRISH CAPTURES — Fine Art Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070707;--ink:#f1f0ea;--muted:#8c8b86;--rule:#2b2b29;--pad:clamp(22px,5vw,90px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif;font-weight:300;line-height:1.65}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.20'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}img{display:block;width:100%;height:100%;object-fit:cover}
header{height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);border-bottom:1px solid #292929;position:relative;z-index:30;background:rgba(7,7,7,.96)}
.brand{font-family:"DM Sans",sans-serif;font-size:20px;font-weight:500;letter-spacing:.18em;white-space:nowrap}.brand span{color:#888}.brand small{display:block;font-size:8px;letter-spacing:.36em;font-weight:400;color:#999;margin-top:-5px}
nav{display:flex;align-items:center;gap:clamp(16px,2.4vw,38px);text-transform:uppercase;letter-spacing:.15em;font-size:10px}nav a,.foot-links a{transition:color .25s}nav a:hover,nav a.active,.foot-links a:hover{color:#fff}nav a{color:#999}
.menu{display:none;background:none;border:0;color:white;font-size:25px}
.page{min-height:65vh}.hero{min-height:calc(100svh - 90px);position:relative;display:flex;align-items:flex-end;background:#111}
.hero img{position:absolute;inset:0;filter:brightness(.65)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 65%)}
.hero-content{position:relative;z-index:1;padding:0 var(--pad) 10vh;max-width:940px}
.eyebrow{font-size:10px;color:#afafaa;letter-spacing:.28em;text-transform:uppercase}.hero h1,.intro h1,.page-title{font-family:"DM Sans",sans-serif;font-weight:300;line-height:1.09;letter-spacing:-.045em;font-size:clamp(56px,8.3vw,142px);margin:20px 0}.hero p{font-size:clamp(14px,1.3vw,18px);color:#ccc;max-width:480px}
.cta{display:inline-flex;align-items:center;gap:20px;border-bottom:1px solid #888;padding:12px 0;text-transform:uppercase;letter-spacing:.18em;font-size:10px;margin-top:24px;transition:gap .2s}.cta:hover{gap:30px}
.section{padding:110px var(--pad)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:42px}.section-head h2{font-family:"DM Sans",sans-serif;font-weight:300;letter-spacing:-.04em;font-size:clamp(36px,5vw,72px);line-height:1.1;margin:12px 0 0}.section-head p{color:var(--muted);font-size:13px;max-width:360px}
.collections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.collection{display:block;position:relative;overflow:hidden;aspect-ratio:1.25;background:#181818}.collection:first-child{grid-column:span 2;aspect-ratio:2.2}.collection img{filter:brightness(.78) saturate(.82);transition:transform .75s,filter .75s}.collection:hover img{transform:scale(1.035);filter:brightness(.9) saturate(1)}.collection:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.7))}.collection-content{position:absolute;bottom:35px;left:38px;z-index:2}.collection h3{font-size:clamp(26px,3.3vw,46px);font-weight:300;letter-spacing:-.03em;margin:0}.collection span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9c9c6}
.intro{padding:clamp(90px,12vw,190px) var(--pad) 65px;border-bottom:1px solid var(--rule)}.intro p{max-width:640px;color:#a7a7a3;font-size:15px}.intro h1{font-size:clamp(50px,7vw,115px);margin-bottom:20px}
.gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:45px var(--pad) 120px}.shot{grid-column:span 6;border:0;padding:0;background:#161616;overflow:hidden;aspect-ratio:4/3;position:relative}.shot:nth-child(3n){grid-column:span 12;aspect-ratio:2/1}.shot img{transition:transform .65s,opacity .4s}.shot:hover img{transform:scale(1.035);opacity:.9}.shot span{position:absolute;bottom:14px;left:20px;letter-spacing:.17em;font-size:10px;text-transform:uppercase;text-shadow:0 2px 8px black}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,7vw,120px);padding:100px var(--pad) 140px}.about-photo{min-height:560px;background:#181818}.about-photo img{filter:grayscale(.5)}.about-copy h2{font-size:clamp(36px,4vw,70px);font-weight:300;letter-spacing:-.05em;line-height:1.12}.about-copy p{max-width:540px;color:#aaa;font-size:15px;line-height:2}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;padding:100px var(--pad) 150px}.contact-grid h2{font-size:clamp(32px,4vw,65px);font-weight:300;letter-spacing:-.05em;line-height:1.2}.contact-grid p{color:#aaa;max-width:460px}.field{margin-bottom:25px}label{display:block;letter-spacing:.15em;text-transform:uppercase;font-size:10px;color:#aaa;margin-bottom:8px}input,textarea{width:100%;padding:13px 0;border:0;border-bottom:1px solid #555;background:transparent;color:#eee;outline:0;border-radius:0}input:focus,textarea:focus{border-bottom-color:white}textarea{min-height:100px;resize:vertical}.submit{padding:15px 26px;background:#eee;color:#111;border:0;text-transform:uppercase;letter-spacing:.16em;font-size:11px}
footer{border-top:1px solid var(--rule);padding:60px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:30px}.foot-logo{font-size:17px;letter-spacing:.17em}.foot-links{display:flex;gap:25px;text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:#999}.copyright{font-size:10px;color:#747474}
.viewer{position:fixed;inset:0;z-index:100;background:rgba(3,3,3,.98);display:none;align-items:center;justify-content:center;padding:65px 80px}.viewer.open{display:flex}.viewer img{width:auto;max-width:100%;max-height:80vh;object-fit:contain}.viewer button{background:none;color:white;border:0;font-size:37px;position:absolute}.close{right:30px;top:10px}.prev{left:22px}.next{right:22px}.viewer-caption{position:absolute;bottom:18px;font-size:11px;color:#aaa;letter-spacing:.15em;text-align:center}
@media(max-width:760px){header{height:74px}.brand{font-size:17px}.menu{display:block}nav{display:none;position:absolute;left:0;top:74px;right:0;background:#090909;border-bottom:1px solid #333;padding:25px var(--pad);flex-direction:column;align-items:start}nav.open{display:flex}.hero{min-height:calc(87svh - 74px)}.hero-content{padding-bottom:8vh}.section{padding:75px var(--pad)}.section-head{display:block}.collections{grid-template-columns:1fr}.collection,.collection:first-child{grid-column:span 1;aspect-ratio:4/3}.collection-content{left:22px;bottom:20px}.gallery{gap:12px}.shot,.shot:nth-child(3n){grid-column:span 12;aspect-ratio:4/3}.intro{padding-top:75px}.about-grid,.contact-grid{grid-template-columns:1fr;padding-top:60px;gap:45px}.about-photo{min-height:400px}footer{flex-direction:column;align-items:flex-start}.viewer{padding:50px 40px}.viewer button{font-size:27px}.prev{left:5px}.next{right:5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

/* Original clean, minimal sans-serif identity; hero keeps the requested brand name. */
.hero h1{font-family:"DM Sans",sans-serif;font-weight:300;font-size:clamp(52px,7.4vw,110px);letter-spacing:-.05em;line-height:1.05}
@media(max-width:760px){.hero h1{font-size:clamp(48px,10vw,76px)}}
</style>
</head>
<body>
<header><a href="#home" class="brand">KRISH <span>CAPTURES</span><small>FINE ART PHOTOGRAPHY</small></a><button class="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav id="nav"><a href="#home">Home</a><a href="#portfolio">Portfolio</a><a href="#landscape">Landscape</a><a href="#wildlife">Wildlife</a><a href="#architecture">Architecture</a><a href="#portraits">Portraits</a><a href="#travel">Travel</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header>
<main id="app"></main>
<footer><div><div class="foot-logo">KRISH CAPTURES</div><p style="color:#777;font-size:12px">Light. Form. Feeling.</p></div><div class="foot-links"><a href="#portfolio">Portfolio</a><a href="#about">About</a><a href="#contact">Contact</a></div><div class="copyright">© <span id="year"></span> KRISH CAPTURES</div></footer>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photograph viewer"><button class="close" aria-label="Close">×</button><button class="prev" aria-label="Previous">‹</button><img alt=""><button class="next" aria-label="Next">›</button><div class="viewer-caption"></div></div>
<script>
/* PERSONALIZE: replace the sample image URLs below with your own Lightroom JPEGs.
   Example: image: 'images/landscape/mountain.jpg'. All demo imagery is third-party. */
const SITE={photographer:"Photographer Name",email:"hello@example.com",tagline:"Light. Form. Feeling.",
bio:["I am a physician with a busy consulting practice, and I have proudly called Lindsay, Ontario, home for the past 25 years. While medicine has been my profession, photography has always been one of my greatest passions. I continue to learn, explore, and refine my skills behind the lens, finding inspiration in the people, places, and moments I encounter.","This collection of photographs reflects my love for art, travel, and the unforgettable experiences I have had, particularly during my journey through Africa. Through these images, I hope to share the raw beauty, vibrant cultures, and breathtaking landscapes that have left a lasting impression on me.","To me, every photograph captures more than an image. It preserves a fleeting moment, an emotion, or a story waiting to be told. Each photograph in this collection holds a special meaning, and I hope these images resonate with you as deeply as they have with me."],
aboutImage:"https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=1400&q=85"};
const photo=(id,w=1800)=>"https://images.unsplash.com/"+id+"?w="+w+"&q=85&auto=format&fit=crop";
const collections=[
{slug:"landscape",name:"Landscape",description:"Where silence meets the horizon.",ids:["photo-1500534623283-312aade485b7","photo-1470770841072-f978cf4d019e","photo-1464822759023-fed622ff2c3b","photo-1441974231531-c6227db76b6e","photo-1501785888041-af3ef285b470","photo-1470252649378-9c29740c9fa8"]},
{slug:"wildlife",name:"Wildlife",description:"Moments from the untamed world.",ids:["photo-1549366021-9f761d450615","photo-1484406566174-9da000fda645","photo-1452570053594-1b985d6ea890","photo-1535338454770-8be927b5a00b","photo-1546182990-dffeafbe841d","photo-1474511320723-9a56873867b5"]},
{slug:"architecture",name:"Architecture",description:"Form, symmetry, texture, and light.",ids:["photo-1487958449943-2429e8be8625","photo-1511818966892-d7d671e672a2","photo-1497366754035-f200968a6e72","photo-1518005020951-eccb494ad742","photo-1486406146926-c627a92ad1ab","photo-1494526585095-c41746248156"]},
{slug:"portraits",name:"Portraits",description:"The quiet power of a human story.",ids:["photo-1534528741775-53994a69daeb","photo-1500648767791-00dcc994a43e","photo-1531123897727-8f129e1688ce","photo-1506794778202-cad84cf45f1d","photo-1517841905240-472988babdf9","photo-1524504388940-b1c1722653e1"]},
{slug:"travel",name:"Travel",description:"A journal of places and passing moments.",ids:["photo-1488646953014-85cb44e25828","photo-1476514525535-07fb3b4ae5f1","photo-1500530855697-b586d89ba3ee","photo-1523906834658-6e24ef2386f9","photo-1533105079780-92b9be482077","photo-1499856871958-5b9627545d1a"]}
];
const app=document.querySelector("#app"),nav=document.querySelector("#nav"),viewer=document.querySelector("#viewer");
let current=[],index=0;
function card(c){return '<a class="collection" href="#'+c.slug+'"><img loading="lazy" src="'+photo(c.ids[0],1400)+'" alt="'+c.name+' photography preview"><div class="collection-content"><span>Explore the collection</span><h3>'+c.name+'</h3></div></a>'}
function home(){return '<section class="hero"><img src="images/homepage.jpg" onerror="this.onerror=null;this.src=photo(collections[0].ids[1],2200)" alt="Icy Strait Point waterfront, Alaska — Krish Captures photography"><div class="hero-content"><div class="eyebrow">KRISH CAPTURES / FINE ART PHOTOGRAPHY</div><h1>Krish Captures</h1><p>Fine art photography. A considered perspective on the world.</p><a class="cta" href="#portfolio">Explore the work <span>↗</span></a></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">SELECTED COLLECTIONS / 01—05</div><h2>Through the lens.</h2></div><p>A curated exploration of the world in five distinct perspectives.</p></div><div class="collections">'+collections.map(card).join('')+'</div></section>'}
function portfolio(){return '<section class="intro"><div class="eyebrow">SELECTED WORK / FIVE COLLECTIONS</div><h1>Portfolio.</h1><p>Explore the photographs by subject. Each collection is a different way of observing the world.</p></section><section class="section"><div class="collections">'+collections.map(card).join('')+'</div></section>'}
function category(c){return '<section class="intro"><div class="eyebrow">KRISH CAPTURES / COLLECTION</div><h1>'+c.name+'.</h1><p>'+c.description+'</p><a href="#portfolio" class="cta">← All collections</a></section><section class="gallery">'+c.ids.map((id,i)=>'<button class="shot" data-photo="'+i+'" aria-label="Open '+c.name+' photograph '+(i+1)+'"><img loading="lazy" src="'+photo(id,1300)+'" alt="'+c.name+' photograph '+(i+1)+' (sample image)"><span>Frame '+String(i+1).padStart(2,'0')+'</span></button>').join('')+'</section>'}
function about(){return '<section class="intro"><div class="eyebrow">THE PHOTOGRAPHER</div><h1>About Me.</h1><p>A personal journey through medicine, photography, and the art of seeing.</p></section><section class="about-grid"><div class="about-photo"><img src="'+SITE.aboutImage+'" alt="Demonstration photo representing a photographer"></div><div class="about-copy"><div class="eyebrow">ABOUT KRISH CAPTURES</div><h2>Photography has always been my passion.</h2>'+SITE.bio.map(p=>'<p>'+p+'</p>').join('')+'<a href="#contact" class="cta">Get in touch ↗</a></div></section>'}
function contact(){return '<section class="intro"><div class="eyebrow">INQUIRIES & COLLABORATIONS</div><h1>Let’s connect.</h1><p>For photography inquiries, collaborations, prints, or simply to say hello.</p></section><section class="contact-grid"><div><div class="eyebrow">CONTACT</div><h2>Every great story starts with a conversation.</h2><p>Send an inquiry using the form. It opens your email application, so nothing is stored on this website.</p><p><a id="contact-email" class="cta" href="mailto:'+SITE.email+'">'+SITE.email+' ↗</a></p></div><form id="contact-form"><div class="field"><label for="who">Your name</label><input id="who" name="who" autocomplete="name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="message">Your message</label><textarea id="message" name="message" required></textarea></div><button class="submit" type="submit">Open email to send ↗</button><p style="font-size:11px;color:#777">To activate inquiries, replace the sample contact email in the SITE settings.</p></form></section>'}
function render(){const route=decodeURIComponent(location.hash.slice(1)||"home").toLowerCase();const c=collections.find(x=>x.slug===route);app.innerHTML=c?category(c):route==="portfolio"?portfolio():route==="about"?about():route==="contact"?contact():home();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+route));nav.classList.remove("open");document.querySelector(".menu").setAttribute("aria-expanded","false");window.scrollTo(0,0);current=c?c.ids:[];app.querySelectorAll("[data-photo]").forEach(b=>b.addEventListener("click",()=>openViewer(+b.dataset.photo)));let form=document.querySelector("#contact-form");if(form)form.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(form),subject=encodeURIComponent("KRISH CAPTURES photography inquiry"),body=encodeURIComponent("Name: "+d.get("who")+"\nEmail: "+d.get("email")+"\n\n"+d.get("message"));location.href="mailto:"+SITE.email+"?subject="+subject+"&body="+body})}
function showImage(){viewer.querySelector("img").src=photo(current[index],2200);viewer.querySelector("img").alt="Expanded photograph "+(index+1);viewer.querySelector(".viewer-caption").textContent=String(index+1).padStart(2,"0")+" / "+String(current.length).padStart(2,"0")}
function openViewer(i){index=i;showImage();viewer.classList.add("open");document.body.style.overflow="hidden";viewer.querySelector(".close").focus()}
function closeViewer(){viewer.classList.remove("open");document.body.style.overflow=""}
function step(n){index=(index+n+current.length)%current.length;showImage()}
document.querySelector(".close").onclick=closeViewer;document.querySelector(".prev").onclick=()=>step(-1);document.querySelector(".next").onclick=()=>step(1);viewer.addEventListener("click",e=>{if(e.target===viewer)closeViewer()});document.addEventListener("keydown",e=>{if(!viewer.classList.contains("open"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
document.querySelector(".menu").onclick=()=>{const state=nav.classList.toggle("open");document.querySelector(".menu").setAttribute("aria-expanded",state)};
document.querySelector("#year").textContent=new Date().getFullYear();window.addEventListener("hashchange",render);render();
</script>
</body></html>
